name: Bug report
description: Report a reproducible problem.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets. Redact tokens, headers, URLs, and customer data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands and a redacted config snippet.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Caplock version
      placeholder: "0.1.0-dev"
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      placeholder: "1.24.3"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15.1 / Ubuntu 24.04"
