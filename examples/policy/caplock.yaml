apiVersion: caplock/v1alpha1
kind: PolicySet
metadata:
  name: finance-agent
  owner: security
  description: Example least-privilege policy for an MCP finance agent
spec:
  defaults:
    effect: deny
  subjects:
    - id: orchestrator
    - id: finance-analyst
      parent: orchestrator
      delegation: attenuate-only
  rules:
    - id: deny-destructive
      effect: deny
      priority: 100
      match:
        capability: [destructive]
      obligations: [audit, alert]
    - id: deny-secret-exfiltration
      effect: deny
      priority: 100
      match:
        capability: [comms, external, network]
        dataClass: [secret]
      obligations: [audit, alert, redact]
    - id: deny-identity-escalation
      effect: deny
      priority: 100
      match:
        capability: [identity]
        args:
          role: {"$in": [admin, owner, superuser]}
      obligations: [audit, alert]
    - id: deny-shell-execution
      effect: deny
      priority: 100
      match:
        capability: [execute]
      obligations: [audit, alert]
    - id: deny-privileged-file-write
      effect: deny
      priority: 100
      match:
        tool: [write_file]
        args:
          path: {"$prefix": "/etc/"}
      obligations: [audit, alert]
    - id: finance-write-after-hours
      effect: deny
      priority: 95
      match:
        capability: [finance.write, finance.approve]
        context:
          time:
            outside: "Mon-Fri 09:00-18:00 Asia/Shanghai"
      obligations: [audit, alert]
    - id: approve-external-provenance-egress
      effect: require_approval
      priority: 90
      match:
        capability: [comms, external, network]
        provenance:
          contains: external_web
      obligations: [audit, human_approval, redact]
    - id: approve-finance-write
      effect: require_approval
      priority: 80
      match:
        capability: [finance.write, finance.approve]
      obligations: [audit, human_approval]
    - id: approve-write-tools
      effect: require_approval
      priority: 70
      match:
        capability: [write]
      obligations: [audit, human_approval]
    - id: allow-read-only-tools
      effect: allow
      priority: 10
      match:
        capability: [read]
